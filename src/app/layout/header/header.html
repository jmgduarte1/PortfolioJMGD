<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" aria-label="Juan Manuel Gomez Duarte home">
      <span class="brand__logo" aria-hidden="true">
        <img src="/assets/logo-square.png" alt="" width="64" height="64" />
      </span>
      <span class="brand__text">Juan Manuel Gomez</span>
    </a>

    @if (menuState$ | async; as menuState) {
      @if (menuState.status === 'loading') {
        <app-loader class="header-loader" [loadingMessage]="'Loading navigation...'" [compact]="true" />
      } @else if (menuState.status === 'loaded') {
        <headless-navigation-renderer
          class="primary-nav"
          [items]="menuState.items"
          [ariaLabel]="menuState.ariaLabel"
          [interceptInternalLinks]="true"
          (linkSelected)="onLinkSelected($event)"
        />
      }
    }
  </div>
</header>
